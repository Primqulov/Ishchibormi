server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Telegram Mini App'ni faqat Telegram ichida ochish mumkin bo'lsin.
    # SAMEORIGIN emas, chunki ilova Telegram klientining iframe'ida ko'rinadi;
    # to'liq taqiq esa uni umuman ochilmaydigan qilib qo'yardi.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hash'li fayl nomlari (index-BuWgOf17.js) — abadiy keshlanadi.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html HECH QACHON keshlanmasin: aks holda foydalanuvchida eski
    # sahifa qolib, u yo'q bo'lib ketgan asset fayllariga murojaat qiladi va
    # ilova oq ekran bo'lib ochiladi.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA — barcha yo'llar index.html ga tushadi.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
